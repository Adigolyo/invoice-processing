name: Deploy

# Deploy stages of the factory's cicd-pipeline.yml, adapted to this repo (Task 22):
#   CI (ci.yml: lint, type-check, unit tests) green on main
#     -> build & push the image once (tagged with the commit SHA, deployed by digest)
#     -> deploy staging (sandbox Workspace account), authenticated smoke test
#     -> release gate: fixture-set E2E against the sandbox account (Task 24), fail-closed
#     -> deploy production: the same digest, after approval on the "production" Environment
#
# Deploys are `gcloud run services update --image`, not `terraform apply -target`:
# Terraform owns everything else and ignores the image (infra/cloudrun.tf), so CI needs no
# Terraform state access and no tfvars. See docs/deployment.md.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_PROJECT_ID, WIF_PROVIDER, CI_DEPLOYER_SA_EMAIL, CI_E2E_SA_EMAIL
# "staging" Environment variables: LEDGER_SPREADSHEET_ID, DRIVE_ROOT_FOLDER_ID (sandbox)
# "production" Environment: required reviewers (the pipeline's only manual gate).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # Workload Identity Federation (keyless auth)

# Never two deploys at once; a newer run waits instead of cancelling a deploy mid-way.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: europe-west1
  AR_REPO: kibit-intake
  IMAGE_NAME: intake-service

jobs:
  # Until infra/ is applied and the repository variables above are set (docs/deployment.md
  # sections 1-4), there is nothing to deploy to: skip the pipeline with a notice instead of
  # failing every push on main. A partial setup still fails loudly.
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        name: Check deployment configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          CI_DEPLOYER_SA_EMAIL: ${{ vars.CI_DEPLOYER_SA_EMAIL }}
          CI_E2E_SA_EMAIL: ${{ vars.CI_E2E_SA_EMAIL }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID WIF_PROVIDER CI_DEPLOYER_SA_EMAIL CI_E2E_SA_EMAIL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 4 ]; then
            echo "::notice title=Deploy skipped::Deployment is not configured yet. Apply infra/ and set the repository variables (docs/deployment.md, section 4)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Deploy misconfigured::Missing repository variables: ${missing[*]} (docs/deployment.md, section 4)."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI just validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_DEPLOYER_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - id: push
        name: Build and push (tag = commit SHA, output = digest reference)
        run: |
          SHA="$(git rev-parse HEAD)"
          REPO="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}"
          docker build --pull -t "${REPO}:${SHA}" .
          docker push "${REPO}:${SHA}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${REPO}:${SHA}")"
          echo "image=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${DIGEST}"

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_DEPLOYER_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        name: Deploy the new image
        run: |
          SERVICE=kibit-intake-staging
          gcloud run services update "$SERVICE" --region="$GCP_REGION" \
            --image="${{ needs.build-and-push.outputs.image }}" --quiet
          # Undo any manual traffic pin from a rollback: serve the new revision.
          gcloud run services update-traffic "$SERVICE" --region="$GCP_REGION" --to-latest --quiet
          URL="$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
      # The service is IAM-protected (no allUsers), so the smoke test needs an identity
      # token. The CI deployer holds run.invoker on the service for exactly this.
      - id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_DEPLOYER_SA_EMAIL }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true
      - name: Smoke test (authenticated)
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          set -euo pipefail
          code() { curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$@"; }
          health="$(code -H "Authorization: Bearer ${ID_TOKEN}" "${URL}/health")"
          echo "GET /health with token: ${health} (want 200)"; [ "$health" = 200 ]
          anon="$(code "${URL}/health")"
          echo "GET /health without token: ${anon} (want 401/403 from Cloud Run IAM)"
          case "$anon" in 401|403) ;; *) exit 1 ;; esac
          run="$(code -X POST -H "Authorization: Bearer ${ID_TOKEN}" "${URL}/run")"
          echo "POST /run as CI deployer: ${run} (want 401, app accepts only the Scheduler SA)"
          [ "$run" = 401 ]

  # Release gate: the 10-invoice fixture set against the SANDBOX account must match the
  # answer key exactly before production is touched (tests/e2e/fixture_set and
  # scripts/verify_fixture_answer_key.py are owned by Task 24). Runs after the staging
  # deploy because staging is bound to the same sandbox account and the suite exercises
  # the deployed pipeline.
  release-gate:
    # Runs the 32-pair fixture suite live against the sandbox account (Task 24): seeds the
    # sandbox inbox, runs the pipeline of this commit twice against a fresh ledger and
    # folder, and checks every row, file, label and draft against the answer key.
    # Fail-closed: a skipped or partial suite fails the gate (KIBIT_E2E_REQUIRED=1,
    # --require-run). Smoke subset: ~3-4 minutes and ~14 AI Compass calls per release.
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      STAGING_JOB: kibit-intake-poll-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_E2E_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      # The staging service polls the same sandbox inbox every 10 minutes. Left running,
      # it would book the seeded fixture emails into the demo ledger mid-suite.
      - id: pause
        name: Pause the staging scheduler during the suite
        run: |
          set -euo pipefail
          state="$(gcloud scheduler jobs describe "$STAGING_JOB" --location="$GCP_REGION" --project="$GCP_PROJECT_ID" --format='value(state)')"
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "staging scheduler was ${state}"
          if [ "$state" = "ENABLED" ]; then
            gcloud scheduler jobs pause "$STAGING_JOB" --location="$GCP_REGION" --project="$GCP_PROJECT_ID"
          fi
      - name: Fixture-set E2E against the sandbox account
        env:
          ENVIRONMENT: staging
          EXTRACTOR_BACKEND: ai_compass
          KIBIT_E2E_REQUIRED: "1"
          KIBIT_E2E_RESULTS_DIR: e2e-results
          # Smoke subset (7 of 32 pairs) and short cooldowns keep the gate to a few
          # minutes; rate-limited polls are retried. Run all 32 locally before risky
          # releases: pytest -m e2e tests/e2e/fixture_set
          KIBIT_E2E_PAIRS: smoke
          KIBIT_E2E_COOLDOWN_S: "15"
        run: pytest -m e2e tests/e2e/fixture_set -v -rs -p no:cacheprovider
      - name: Assert zero wrong rows, files and labels
        run: |
          set -euo pipefail
          shopt -s nullglob
          results=(e2e-results/*.json)
          if [ "${#results[@]}" -ne 1 ]; then
            echo "expected exactly one E2E results file, found ${#results[@]}"; exit 1
          fi
          python scripts/verify_fixture_answer_key.py --strict --require-run --results "${results[0]}"
      - name: Resume the staging scheduler
        if: always() && steps.pause.outputs.state == 'ENABLED'
        run: gcloud scheduler jobs resume "$STAGING_JOB" --location="$GCP_REGION" --project="$GCP_PROJECT_ID"

  deploy-production:
    needs: [build-and-push, release-gate]
    runs-on: ubuntu-latest
    environment: production # required reviewers configured on this Environment
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_DEPLOYER_SA_EMAIL }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: deploy
        name: Promote the digest validated in staging
        run: |
          SERVICE=kibit-intake-production
          gcloud run services update "$SERVICE" --region="$GCP_REGION" \
            --image="${{ needs.build-and-push.outputs.image }}" --quiet
          gcloud run services update-traffic "$SERVICE" --region="$GCP_REGION" --to-latest --quiet
          URL="$(gcloud run services describe "$SERVICE" --region="$GCP_REGION" --format='value(status.url)')"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
      - id: idtoken
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_DEPLOYER_SA_EMAIL }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true
      - name: Smoke test (authenticated)
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
        run: |
          set -euo pipefail
          code() { curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$@"; }
          health="$(code -H "Authorization: Bearer ${ID_TOKEN}" "${URL}/health")"
          echo "GET /health with token: ${health} (want 200)"; [ "$health" = 200 ]
          anon="$(code "${URL}/health")"
          echo "GET /health without token: ${anon} (want 401/403 from Cloud Run IAM)"
          case "$anon" in 401|403) ;; *) exit 1 ;; esac
          run="$(code -X POST -H "Authorization: Bearer ${ID_TOKEN}" "${URL}/run")"
          echo "POST /run as CI deployer: ${run} (want 401, app accepts only the Scheduler SA)"
          [ "$run" = 401 ]
