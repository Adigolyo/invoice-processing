name: CI

# Lint + unit-test stages of the factory's cicd-pipeline.yml. Integration, E2E and
# deploy stages are added by later tasks (22, 24).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy intake/

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests (hermetic, no network)
        run: pytest tests/unit -v --cov=intake --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.xml
