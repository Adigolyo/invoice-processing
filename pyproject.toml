[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kibit-invoice-intake"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Automated invoice intake: Gmail -> Gemini extraction -> Drive filing -> Sheets ledger"
requires-python = ">=3.12"

[tool.setuptools.dynamic]
version = { attr = "intake.__version__" }
dependencies = { file = ["requirements.txt"] }
optional-dependencies = { dev = { file = ["requirements-dev.txt"] } }

[tool.setuptools.packages.find]
include = ["intake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: calls real external APIs (Gemini, sandbox Workspace)",
    "e2e: end-to-end fixture-set release gate against the sandbox Workspace (opt in: -m e2e)",
]

[tool.coverage.run]
source = ["intake"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# google-api-python-client ships no type information (no py.typed, no stubs package).
# Scoped to that package only; its resources are typed as explicit ``Any`` aliases in
# intake/clients/*_client.py and every response is shape-checked at runtime.
module = ["googleapiclient", "googleapiclient.*"]
ignore_missing_imports = true
